; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	esp32async/ESPAsyncWebServer
	bblanchon/ArduinoJson

; The hub: hosts the AP, the React dashboard, and the prop registry. No
; hardware features of its own - it only coordinates the props below.
[env:prop_hub]
build_src_filter = +<*> -<prop_main.cpp> -<prop_soundbox_main.cpp>
board_build.filesystem = littlefs

; A prop node: joins the hub's AP, self-registers, and exposes POST /trigger.
[env:prop_node]
build_src_filter = +<*> -<main.cpp> -<prop_soundbox_main.cpp>

; A soundbox prop: DFPlayer Mini MP3 module triggered over UART2 (GPIO16/17).
[env:prop_soundbox]
build_src_filter = +<*> -<main.cpp> -<prop_main.cpp>
lib_deps =
	${env.lib_deps}
	dfrobot/DFRobotDFPlayerMini@^1.0.6
